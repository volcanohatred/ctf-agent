# CTF Agent — docker-compose for the orchestrator container.
#
# Prerequisites:
#   1. cp .env.example .env  and fill in keys (ANTHROPIC_*, GATEWAY_*, ...)
#   2. Set HOST_PROJECT_DIR in .env to the ABSOLUTE path of this directory on
#      the Docker host (e.g. D:/code/ctf/ctf-agent-main/ctf-agent-main or
#      /home/you/ctf-agent). Required: the agent spawns sandbox containers via
#      the host docker socket, and bind mounts must reference HOST paths.
#   3. Build the sandbox image once:
#        docker build -f sandbox/Dockerfile.sandbox -t ctf-sandbox .
#
# Usage:
#   Full competition (coordinator mode):
#     docker compose run --rm --service-ports agent
#   Single challenge:
#     docker compose run --rm agent ctf-solve --challenge challenges/baby-pwn -v
#   Offline benchmark:
#     docker compose run --rm agent ctf-bench --challenges-dir challenges -v
#   Send a hint to the running coordinator:
#     docker compose exec agent uv run --no-sync ctf-msg "focus on the JWT kid param"
#
# Ports (both published loopback-only on the HOST, so neither the LAN nor a
# sandbox container can reach them via host.docker.internal):
#   9400 — operator message endpoint (ctf-msg). MSG_PORT must match.
#   8080 — web dashboard, bearer-token gated. It can inject instructions into
#          solvers and export confirmed flags, so keep it loopback-only or put a
#          reverse proxy with auth in front. The token is auto-generated when
#          DASHBOARD_TOKEN is empty and printed once at startup with the
#          ready-to-open URL; to fetch it again:
#            docker compose logs agent | grep -i "access token"

services:
  agent:
    build: .
    image: ctf-agent
    env_file:
      - .env
    environment:
      # Only what genuinely must DIFFER inside the container belongs here.
      #
      # Do NOT re-declare tuning defaults (SOLVER_TIME_BUDGET_S, MAX_ATTEMPTS_*,
      # ...). `env_file: .env` already passes every value through, and
      # backend/config.py is the single source of truth for defaults. Duplicating
      # them here caused real drift: the code default for
      # MAX_ATTEMPTS_PER_CHALLENGE was raised to 12 while this file still pinned
      # 6, silently allowing only one distil->merge cycle. validate_tuning()
      # caught it at startup, which is the only reason it was noticed.
      #
      # DooD: sandbox binds must use HOST paths
      HOST_PROJECT_DIR: ${HOST_PROJECT_DIR:?Set HOST_PROJECT_DIR in .env (absolute project path on the docker host)}
      # Skills: BOTH are required for the library to be used. SKILLS_DIR is what
      # the AGENT reads (triage / index rendering / the technique-rotation queue);
      # SKILLS_HOST_DIR is what gets bind-mounted into each sandbox.
      #
      # SKILLS_DIR stays pinned to the in-container mount point and is NOT the
      # on/off switch — compose `environment:` overrides `env_file:`, so blanking it
      # from .env would not work anyway. To disable the agent-side skill machinery
      # while keeping the library mounted for solvers to read on their own, set
      # SKILL_HINTS=false in .env (it passes through env_file: normally). Rotation
      # has its own switch, SKILL_ROTATE_APPROACHES, so the two can be A/B'd apart.
      SKILLS_DIR: /skills
      SKILLS_HOST_DIR: ${SKILLS_HOST_DIR:-}
      # Inside the container these two MUST be 0.0.0.0 or Docker cannot forward
      # the published port. Exposure is controlled host-side by the 127.0.0.1
      # bind in `ports:` below, plus the dashboard's bearer token.
      MSG_HOST: ${MSG_HOST:-0.0.0.0}
      DASHBOARD_HOST: ${DASHBOARD_HOST:-0.0.0.0}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./challenges:/app/challenges
      - ./logs:/app/logs
      - ./.workspaces:/app/.workspaces
      - ${SKILLS_HOST_DIR:-./skills}:/skills:ro
    ports:
      # Loopback-only on the HOST: reachable from your machine, not from the LAN
      # and not from a sandbox container via host.docker.internal.
      - "127.0.0.1:9400:9400"  # operator message endpoint (ctf-msg)
      - "127.0.0.1:8080:8080"  # web dashboard
    tty: true
    stdin_open: true
    restart: "no"
